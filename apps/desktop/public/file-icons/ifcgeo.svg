<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Geotechniek-object bestand">
  <!--
    File-association icon for .ifcgeo single-CPT exchange files.
    Same document motif but with the IFCX-style 3D outline overlaid
    on the qc curve — telegraphs "this is a single geo-object in
    IFC-flavoured exchange format".
  -->

  <rect x="80" y="80" width="864" height="864" fill="#FAFAF9" stroke="#36363E" stroke-width="24" rx="40" />
  <path d="M 720 80 L 944 304 L 720 304 Z" fill="#D97706" />
  <path d="M 720 80 L 720 304 L 944 304" fill="none" stroke="#36363E" stroke-width="24" stroke-linejoin="round" />

  <text x="180" y="360" font-family="'Space Grotesk', 'Inter', sans-serif"
        font-weight="800" font-size="170" fill="#36363E" letter-spacing="-6">IFCGEO</text>
  <text x="180" y="430" font-family="'Inter', sans-serif" font-weight="500"
        font-size="58" fill="#71717A" letter-spacing="2">SONDERING IFCX</text>

  <!-- Single sondering chart -->
  <line x1="220" y1="540" x2="220" y2="880" stroke="#A1A1AA" stroke-width="6" stroke-linecap="round" />
  <line x1="220" y1="540" x2="780" y2="540" stroke="#36363E" stroke-width="6" stroke-linecap="round" />
  <polyline points="280,560 320,600 400,640 350,690 460,730 380,780 520,820 420,860 560,880"
            fill="none" stroke="#D97706" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round" />

  <!-- Isometric "object" cube overlaid bottom-right to brand it as IFCX -->
  <g fill="none" stroke="#36363E" stroke-width="10" stroke-linejoin="round" opacity="0.85">
    <polygon points="700,640 780,610 860,640 780,670" />
    <polygon points="700,640 700,780 780,810 780,670" />
    <polygon points="860,640 860,780 780,810 780,670" />
  </g>
</svg>
