[package]
name = "open-geo-studio"
version = "0.4.0"
description = "Open Geotechniek Studio — desktop CPT viewer and report generator"
authors = ["Open AEC Foundation"]
edition = "2021"

[lib]
name = "open_geo_studio_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Single-instance — when a second invocation happens (e.g. double-clicking
# a .gef file while the app is already running), forward the CLI args to
# the running instance instead of spawning a second window.
tauri-plugin-single-instance = "2"
pdf-writer = "0.13"
ttf-parser = "0.25"
lopdf = "0.34"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = "0.4"
quick-xml = "0.36"
# Tokio runtime is nodig in --mcp mode (zonder Tauri) zodat async commands
# (BRO API, IFC-generatie, PDF rapport) ook via MCP-tools aanroepbaar zijn.
# In GUI-mode levert Tauri zelf de runtime, dan is deze dep ongebruikt.
# `net` is nodig voor de REST-server (--serve): tokio TcpListener.
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# Base64 voor het encoderen van PDF-bytes in MCP-respons (stdio is text-only;
# binary data moet als base64-string in JSON-respons).
base64 = "0.22"
# REST/HTTP-API (--serve mode). axum bovenop tokio/hyper; spiegelt dezelfde
# core-functies als de MCP-server, maar over HTTP. Lokaal (127.0.0.1) bedoeld.
axum = "0.7"

# Path dependencies into crates-warehouse/ (sibling of cpt-viewer/).
# cpt-core: CPT domain library (parsers, Robertson, layers, report).
# openaec-core: production-grade PDF generator (V1/V2 schema).
# openaec-engine: PDF rendering engine.
cpt-core       = { path = "../../../../crates-warehouse/cpt-core" }
open-geotechniek-kernel = { path = "../../../../crates-warehouse/open-geotechniek-kernel" }
bro-xml        = { path = "../../../../crates-warehouse/bro-xml" }
openaec-core   = { path = "../../../../crates-warehouse/openaec-core" }
openaec-engine = { path = "../../../../crates-warehouse/openaec-engine" }
acadrust = "0.4.0"
