name: Deploy site

# Deploy gebeurt UITSLUITEND bij een bewuste release:
#   - een version-tag (v1.2.3) pushen, of
#   - handmatig via "Run workflow" (workflow_dispatch).
# NIET meer automatisch bij elke push naar main — dat zette eerder
# onbedoeld tussenstanden online.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/open-geotechniek-studio.open-aec.com
      deploy_source: apps/desktop/dist
      node_version: "22"
      install_command: cd apps/desktop && npm ci
      # VITE_PUBLIC_WEB=1 → registry.ts toont alleen status="available"
      # modules; experimentele berekeningen (Funderingspaal, Kalendering)
      # blijven uit de publieke bundle/UI.
      build_command: cd apps/desktop && VITE_PUBLIC_WEB=1 npm run build
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
